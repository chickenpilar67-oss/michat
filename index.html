<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mr. KIRK Goian Bego</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }


        /* =========================
           PANTALLA PARA PONER NOMBRE
        ========================= */

        #pantallaNombre {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at center, #292929 0%, #111 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .nombre-caja {
            width: min(90%, 430px);
            background: #1d1d1d;
            border: 1px solid #444;
            border-radius: 22px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.6);
        }

        .nombre-caja h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .nombre-caja p {
            color: #aaa;
            margin-bottom: 25px;
        }

        #nombreInput {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #555;
            background: #111;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #entrarBtn {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #d3a928;
            color: #111;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        #entrarBtn:hover {
            background: #e4bd3e;
        }


        /* =========================
           APLICACIÓN
        ========================= */

        #app {
            display: none;
            height: 100vh;
            width: 100%;
        }


        /* =========================
           BARRA LATERAL
        ========================= */

        .sidebar {
            width: 230px;
            height: 100vh;
            background: #181818;
            border-right: 1px solid #333;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }

        .logo {
            padding: 25px 18px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }

        .logo span {
            color: #d3a928;
        }

        .menu {
            padding: 15px 10px;
        }

        .menu-btn {
            width: 100%;
            border: none;
            background: transparent;
            color: #bbb;
            padding: 14px 15px;
            margin-bottom: 6px;
            border-radius: 10px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
        }

        .menu-btn:hover {
            background: #292929;
            color: white;
        }

        .menu-btn.activo {
            background: #302a16;
            color: #e2bb35;
        }

        .usuarios {
            margin-top: auto;
            padding: 18px;
            border-top: 1px solid #333;
            color: #999;
            font-size: 14px;
        }

        .usuarios strong {
            color: #70d47b;
        }


        /* =========================
           CONTENIDO
        ========================= */

        .contenido {
            margin-left: 230px;
            width: calc(100% - 230px);
            height: 100vh;
            position: relative;
        }

        .pantalla {
            display: none;
            height: 100%;
            width: 100%;
        }

        .pantalla.activa {
            display: flex;
        }


        /* =========================
           CHAT
        ========================= */

        #pantallaChat {
            flex-direction: column;
        }

        .chat-header {
            height: 70px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 1px solid #333;
            background: #181818;
        }

        .chat-header h2 {
            font-size: 20px;
        }

        .mi-nombre {
            color: #aaa;
            font-size: 14px;
        }

        #mensajes {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            position: relative;
        }

        #mensajes::before {
            content: "Gioian Bego CHARLIE KIRK";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,.025);
            font-size: 45px;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
        }

        .mensaje {
            position: relative;
            z-index: 2;
            max-width: 75%;
            width: fit-content;
            background: #f1e3c3;
            color: #000;
            padding: 10px 14px;
            border-radius: 15px;
            margin-bottom: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,.2);
        }

        .mensaje.mio {
            margin-left: auto;
        }

        .mensaje-nombre {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #725d20;
        }

        /*
           EL NOMBRE ES LO PRINCIPAL.
           EL RANGO ES PEQUEÑO Y DISCRETO.
        */

        .rango-botellero {
            color: #c94a4a;
            font-size: 10px;
            font-weight: normal;
            opacity: 0.75;
            margin-left: 5px;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .mensaje-texto {
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .mensaje-hora {
            font-size: 10px;
            margin-top: 5px;
            text-align: right;
            color: #665e4c;
        }

        .imagen-mensaje {
            display: block;
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 5px;
            object-fit: contain;
        }


        /* =========================
           ZONA ESCRIBIR
        ========================= */

        .chat-input {
            min-height: 75px;
            padding: 12px 18px;
            background: #181818;
            border-top: 1px solid #333;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #mensajeInput {
            flex: 1;
            min-width: 0;
            padding: 13px 15px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #101010;
            color: white;
            outline: none;
            font-size: 15px;
        }

        #enviarBtn,
        #imagenBtn {
            border: none;
            border-radius: 11px;
            padding: 12px 15px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        #enviarBtn {
            background: #d3a928;
            color: #111;
        }

        #imagenBtn {
            background: #333;
            color: white;
        }

        #enviarBtn:hover {
            background: #e5bd3d;
        }

        #imagenBtn:hover {
            background: #444;
        }

        #archivoImagen {
            display: none;
        }


        /* =========================
           CHAT DE IMÁGENES
        ========================= */

        #pantallaImagenes {
            flex-direction: column;
        }

        .imagenes-contenido {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .imagenes-info {
            background: #1b1b1b;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #aaa;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .imagen-tarjeta {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 10px;
            overflow: hidden;
        }

        .imagen-tarjeta img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            background: #111;
        }

        .imagen-autor {
            color: #d3a928;
            font-weight: bold;
            font-size: 13px;
            margin-top: 10px;
        }

        .imagen-rango {
            color: #c94a4a;
            font-size: 10px;
            font-weight: normal;
            opacity: .75;
            margin-left: 5px;
        }

        .imagen-hora {
            color: #777;
            font-size: 11px;
            margin-top: 4px;
        }

        .imagenes-input {
            min-height: 75px;
            background: #181818;
            border-top: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        #enviarImagenesBtn {
            background: #d3a928;
            color: #111;
            border: none;
            border-radius: 12px;
            padding: 13px 22px;
            font-weight: bold;
            cursor: pointer;
        }

        #enviarImagenesBtn:hover {
            background: #e5bd3d;
        }


        /* =========================
           MOSCA
        ========================= */

        #mosca {
            position: fixed;
            width: 55px;
            height: 55px;
            object-fit: contain;
            z-index: 9000;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
            transition:
                left 2.8s ease-in-out,
                top 2.8s ease-in-out;
        }


        /* =========================
           VENTANA MOSCA
        ========================= */

        #moscaOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.72);
            z-index: 9500;
            justify-content: center;
            align-items: center;
        }

        .mosca-caja {
            width: min(90%, 420px);
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,.8);
        }

        .mosca-caja h2 {
            font-size: 27px;
            margin-bottom: 25px;
        }

        #baleBaleBtn {
            border: none;
            border-radius: 12px;
            padding: 13px 30px;
            background: #d3a928;
            color: #111;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        #baleBaleBtn:hover {
            background: #e5bd3d;
        }


        /* =========================
           RULETA
        ========================= */

        #pantallaRuleta {
            overflow-y: auto;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background:
                radial-gradient(circle at center, #202020 0%, #0e0e0e 75%);
        }

        .ruleta-header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .ruleta-header h2 {
            font-size: 25px;
        }

        .saldo {
            background: #191919;
            border: 1px solid #555;
            padding: 10px 17px;
            border-radius: 12px;
            color: #e5c24b;
            font-weight: bold;
        }

        .ruleta-zona {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 430px 1fr;
            gap: 30px;
            align-items: start;
        }

        .rueda-contenedor {
            position: relative;
            width: 400px;
            height: 400px;
            margin: auto;
        }

        .puntero {
            position: absolute;
            z-index: 20;
            left: 50%;
            top: -5px;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-top: 28px solid #e5c24b;
            filter: drop-shadow(0 3px 3px black);
        }

        #ruedaImagen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-origin: center center;
            transition:
                transform 5.8s cubic-bezier(.12,.72,.18,1);
            display: block;
        }

        .apuestas-panel {
            background: #171717;
            border: 1px solid #333;
            border-radius: 18px;
            padding: 18px;
        }

        .fichas {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .ficha {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px dashed #ddd;
            background: #d3a928;
            color: #111;
            font-weight: bold;
            cursor: pointer;
            box-shadow:
                inset 0 0 0 3px #b18d18,
                0 4px 7px rgba(0,0,0,.5);
        }

        .ficha:hover {
            transform: translateY(-2px);
        }

        .ficha.seleccionada {
            outline: 3px solid white;
            transform: translateY(-4px);
        }

        .tabla-numeros {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            margin-bottom: 12px;
        }

        .numero-apuesta {
            min-height: 40px;
            border: 1px solid #555;
            color: white;
            font-weight: bold;
            border-radius: 7px;
            cursor: pointer;
        }

        .numero-apuesta.rojo {
            background: #b72828;
        }

        .numero-apuesta.negro {
            background: #151515;
        }

        .numero-apuesta.cero {
            background: #147d39;
            grid-column: span 6;
        }

        .numero-apuesta:hover {
            filter: brightness(1.3);
        }

        .apuestas-fila {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .apuesta-extra {
            padding: 11px 5px;
            background: #282828;
            border: 1px solid #555;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .apuesta-extra:hover {
            background: #383838;
        }

        .resumen-apuesta {
            background: #101010;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
            color: #bbb;
            font-size: 14px;
        }

        #botonGirar {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #d3a928;
            color: #111;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        #botonGirar:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        #botonLimpiar {
            width: 100%;
            margin-top: 8px;
            padding: 11px;
            border: 1px solid #555;
            border-radius: 10px;
            background: #242424;
            color: white;
            cursor: pointer;
        }

        .resultado {
            margin-top: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            min-height: 30px;
        }

        .apuesta-seleccionada {
            outline: 3px solid #e5c24b !important;
            box-shadow: 0 0 15px rgba(229,194,75,.3);
        }


        /* =========================
           JUEGO DE BOTELLAS
        ========================= */

        #pantallaJuego {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111827;
        }

        #pantallaJuego iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 75px;
            }

            .logo {
                font-size: 0;
                text-align: center;
            }

            .logo span {
                font-size: 20px;
            }

            .menu-btn {
                font-size: 0;
                text-align: center;
                padding: 15px 5px;
            }

            .menu-btn::first-letter {
                font-size: 20px;
            }

            .usuarios {
                font-size: 0;
                text-align: center;
            }

            .usuarios strong {
                font-size: 18px;
            }

            .contenido {
                margin-left: 75px;
                width: calc(100% - 75px);
            }

            .ruleta-zona {
                grid-template-columns: 1fr;
            }

            .rueda-contenedor {
                width: min(85vw, 400px);
                height: min(85vw, 400px);
            }

        }

        @media (max-width: 600px) {

            .chat-input {
                gap: 5px;
            }

            #enviarBtn,
            #imagenBtn {
                padding: 12px 10px;
                font-size: 12px;
            }

            .mensaje {
                max-width: 90%;
            }

            .galeria {
                grid-template-columns: 1fr;
            }

            #mosca {
                width: 50px;
                height: 50px;
            }

        }

    </style>
</head>

<body>


    <!-- =========================
         PANTALLA NOMBRE
    ========================= -->

    <div id="pantallaNombre">

        <div class="nombre-caja">

            <h1>Mr. KIRK Goian Bego</h1>

            <p>
                Escribe tu nombre para entrar
            </p>

            <input
                id="nombreInput"
                type="text"
                maxlength="25"
                placeholder="Tu nombre..."
                autocomplete="off"
            >

            <button id="entrarBtn">
                Entrar
            </button>

        </div>

    </div>


    <!-- =========================
         APLICACIÓN
    ========================= -->

    <div id="app">


        <!-- BARRA LATERAL -->

        <aside class="sidebar">

            <div class="logo">
                <span>MK</span> Chat
            </div>

            <div class="menu">

                <button
                    class="menu-btn activo"
                    id="menuChat"
                    onclick="cambiarPantalla('chat')"
                >
                    💬 Chat
                </button>

                <button
                    class="menu-btn"
                    id="menuImagenes"
                    onclick="cambiarPantalla('imagenes')"
                >
                    🖼️ Imágenes
                </button>

                <button
                    class="menu-btn"
                    id="menuRuleta"
                    onclick="cambiarPantalla('ruleta')"
                >
                    🎰 Ruleta
                </button>

                <button
                    class="menu-btn"
                    id="menuJuego"
                    onclick="cambiarPantalla('juego')"
                >
                    🍾 Juego de Botellas
                </button>

            </div>

            <div class="usuarios">
                🟢 <strong id="contadorUsuarios">0</strong>
                conectados
            </div>

        </aside>


        <!-- CONTENIDO -->

        <main class="contenido">


            <!-- =========================
                 CHAT
            ========================= -->

            <section
                id="pantallaChat"
                class="pantalla activa"
            >

                <header class="chat-header">

                    <h2>💬 Chat</h2>

                    <div class="mi-nombre">
                        <span id="nombreUsuario"></span>
                    </div>

                </header>


                <div id="mensajes"></div>


                <div class="chat-input">

                    <input
                        id="mensajeInput"
                        type="text"
                        placeholder="Escribe un mensaje..."
                        autocomplete="off"
                    >

                    <button id="imagenBtn">
                        🖼️
                    </button>

                    <input
                        id="archivoImagen"
                        type="file"
                        accept="image/*"
                    >

                    <button id="enviarBtn">
                        Enviar
                    </button>

                </div>

            </section>


            <!-- =========================
                 IMÁGENES
            ========================= -->

            <section
                id="pantallaImagenes"
                class="pantalla"
            >

                <header class="chat-header">

                    <h2>🖼️ Imágenes</h2>

                    <div class="mi-nombre">
                        <span id="nombreUsuarioImagenes"></span>
                    </div>

                </header>


                <div class="imagenes-contenido">

                    <div class="imagenes-info">
                        Este es el chat de imágenes.
                        Aquí solo se pueden enviar imágenes.
                    </div>

                    <div
                        id="galeriaImagenes"
                        class="galeria"
                    ></div>

                </div>


                <div class="imagenes-input">

                    <button id="enviarImagenesBtn">
                        🖼️ Enviar imagen
                    </button>

                    <input
                        id="archivoImagenes"
                        type="file"
                        accept="image/*"
                        style="display:none"
                    >

                </div>

            </section>


            <!-- =========================
                 RULETA
            ========================= -->

            <section
                id="pantallaRuleta"
                class="pantalla"
            >

                <div class="ruleta-header">

                    <h2>🎰 Ruleta</h2>

                    <div class="saldo">
                        🪙 <span id="saldo">500</span>
                    </div>

                </div>


                <div class="ruleta-zona">


                    <!-- RUEDA -->

                    <div>

                        <div class="rueda-contenedor">

                            <div class="puntero"></div>

                            <img
                                id="ruedaImagen"
                                src="ruleta.png"
                                alt="Ruleta"
                            >

                        </div>

                        <div
                            id="resultadoRuleta"
                            class="resultado"
                        ></div>

                    </div>


                    <!-- APUESTAS -->

                    <div class="apuestas-panel">

                        <div class="fichas">

                            <button
                                class="ficha seleccionada"
                                data-valor="10"
                            >
                                10
                            </button>

                            <button
                                class="ficha"
                                data-valor="25"
                            >
                                25
                            </button>

                            <button
                                class="ficha"
                                data-valor="50"
                            >
                                50
                            </button>

                            <button
                                class="ficha"
                                data-valor="100"
                            >
                                100
                            </button>

                            <button
                                class="ficha"
                                data-valor="500"
                            >
                                500
                            </button>

                        </div>


                        <div
                            id="tablaNumeros"
                            class="tabla-numeros"
                        ></div>


                        <div class="apuestas-fila">

                            <button
                                class="apuesta-extra"
                                data-apuesta="rojo"
                            >
                                🔴 Rojo
                            </button>

                            <button
                                class="apuesta-extra"
                                data-apuesta="negro"
                            >
                                ⚫ Negro
                            </button>

                            <button
                                class="apuesta-extra"
                                data-apuesta="par"
                            >
                                Par
                            </button>

                        </div>


                        <div class="apuestas-fila">

                            <button
                                class="apuesta-extra"
                                data-apuesta="impar"
                            >
                                Impar
                            </button>

                            <button
                                class="apuesta-extra"
                                data-apuesta="bajo"
                            >
                                1–18
                            </button>

                            <button
                                class="apuesta-extra"
                                data-apuesta="alto"
                            >
                                19–36
                            </button>

                        </div>


                        <div class="apuestas-fila">

                            <button
                                class="apuesta-extra"
                                data-apuesta="docena1"
                            >
                                1–12
                            </button>

                            <button
                                class="apuesta-extra"
                                data-apuesta="docena2"
                            >

    <!-- =========================
         MOSCA
    ========================= -->

    <img
        id="mosca"
        src="mosca.png"
        alt="Mosca"
    >


    <!-- =========================
         VENTANA DE LA MOSCA
    ========================= -->

    <div id="moscaOverlay">

        <div class="mosca-caja">

            <h2>
                Ez zirikatu Aguirre JR.
            </h2>

            <button id="baleBaleBtn">
                bale bale
            </button>

    </div>


    <script>


        /* =========================
           SOCKET.IO
        ========================= */

        const socket = io();


        /* =========================
           VARIABLES
        ========================= */

        let nombre = "";

        let rangoBotelleroActual = "NOOB";

        let pantallaActual = "chat";

        let saldo = 500;

        let fichaSeleccionada = 10;

        let apuestas = {};

        let girando = false;

        let rotacionActual = 0;


        /* =========================
           RECIBIR RANGO DEL JUEGO
        ========================= */

        window.addEventListener(
            "message",
            function(event){

                if(
                    event.origin !==
                    window.location.origin
                ){
                    return;
                }


                if(
                    !event.data ||
                    event.data.tipo !==
                    "rangoBotellero"
                ){
                    return;
                }


                rangoBotelleroActual =
                    event.data.rango ||
                    "NOOB";

            }
        );


        /* =========================
           NOMBRE
        ========================= */

        const pantallaNombre =
            document.getElementById(
                "pantallaNombre"
            );

        const app =
            document.getElementById(
                "app"
            );

        const nombreInput =
            document.getElementById(
                "nombreInput"
            );

        const entrarBtn =
            document.getElementById(
                "entrarBtn"
            );


        entrarBtn.addEventListener(
            "click",
            entrar
        );


        nombreInput.addEventListener(
            "keydown",
            function(e){

                if(e.key === "Enter"){
                    entrar();
                }

            }
        );


        function entrar(){

            const nombreEscrito =
                nombreInput.value.trim();


            if(!nombreEscrito){
                return;
            }


            nombre =
                nombreEscrito;


            document.getElementById(
                "nombreUsuario"
            ).textContent =
                nombre;


            document.getElementById(
                "nombreUsuarioImagenes"
            ).textContent =
                nombre;


            pantallaNombre.style.display =
                "none";


            app.style.display =
                "flex";


            moverMosca();

        }


        /* =========================
           CAMBIAR PANTALLAS
        ========================= */

        function cambiarPantalla(pantalla){

            pantallaActual =
                pantalla;


            document
                .querySelectorAll(".pantalla")
                .forEach(function(elemento){

                    elemento.classList.remove(
                        "activa"
                    );

                });


            document
                .querySelectorAll(".menu-btn")
                .forEach(function(elemento){

                    elemento.classList.remove(
                        "activo"
                    );

                });


            if(pantalla === "chat"){

                document
                    .getElementById(
                        "pantallaChat"
                    )
                    .classList.add(
                        "activa"
                    );


                document
                    .getElementById(
                        "menuChat"
                    )
                    .classList.add(
                        "activo"
                    );

            }


            if(pantalla === "imagenes"){

                document
                    .getElementById(
                        "pantallaImagenes"
                    )
                    .classList.add(
                        "activa"
                    );


                document
                    .getElementById(
                        "menuImagenes"
                    )
                    .classList.add(
                        "activo"
                    );

            }


            if(pantalla === "ruleta"){

                document
                    .getElementById(
                        "pantallaRuleta"
                    )
                    .classList.add(
                        "activa"
                    );


                document
                    .getElementById(
                        "menuRuleta"
                    )
                    .classList.add(
                        "activo"
                    );

            }


            if(pantalla === "juego"){

                document
                    .getElementById(
                        "pantallaJuego"
                    )
                    .classList.add(
                        "activa"
                    );


                document
                    .getElementById(
                        "menuJuego"
                    )
                    .classList.add(
                        "activo"
                    );

            }

        }


        /* =========================
           USUARIOS CONECTADOS
        ========================= */

        socket.on(
            "usuarios",
            function(cantidad){

                document.getElementById(
                    "contadorUsuarios"
                ).textContent =
                    cantidad;

            }
        );


        /* =========================
           ENVIAR MENSAJE
        ========================= */

        const mensajeInput =
            document.getElementById(
                "mensajeInput"
            );

        const enviarBtn =
            document.getElementById(
                "enviarBtn"
            );


        function enviarMensaje(){

            const texto =
                mensajeInput.value.trim();


            if(!texto){
                return;
            }


            const datos = {

                nombre:
                    nombre,

                texto:
                    texto,

                rango:
                    rangoBotelleroActual

            };


            socket.emit(
                "mensaje",
                datos
            );


            mensajeInput.value =
                "";

            mensajeInput.focus();

        }


        enviarBtn.addEventListener(
            "click",
            enviarMensaje
        );


        mensajeInput.addEventListener(
            "keydown",
            function(e){

                if(e.key === "Enter"){
                    enviarMensaje();
                }

            }
        );


        /* =========================
           RECIBIR MENSAJES
        ========================= */

        socket.on(
            "mensaje",
            function(mensaje){

                let contenidoEspecial =
                    null;


                try {

                    contenidoEspecial =
                        JSON.parse(
                            mensaje.texto
                        );

                } catch(e){

                    contenidoEspecial =
                        null;

                }


                /* IMAGEN */

                if(
                    contenidoEspecial &&
                    contenidoEspecial.tipo ===
                    "imagen"
                ){

                    if(
                        contenidoEspecial.canal ===
                        "imagenes"
                    ){

                        mostrarImagenGaleria(
                            mensaje.nombre,
                            contenidoEspecial.datos,
                            mensaje.hora,
                            mensaje.rango
                        );

                    } else {

                        mostrarImagenChat(
                            mensaje.nombre,
                            contenidoEspecial.datos,
                            mensaje.hora,
                            mensaje.rango
                        );

                    }

                    return;

                }


                /* MENSAJE NORMAL */

                mostrarMensajeTexto(
                    mensaje
                );

            }
        );


        /* =========================
           MOSTRAR MENSAJE TEXTO
        ========================= */

        function mostrarMensajeTexto(
            mensaje
        ){

            const mensajes =
                document.getElementById(
                    "mensajes"
                );


            const caja =
                document.createElement(
                    "div"
                );


            caja.className =
                "mensaje";


            if(
                mensaje.nombre ===
                nombre
            ){

                caja.classList.add(
                    "mio"
                );

            }


            const nombreElemento =
                document.createElement(
                    "div"
                );


            nombreElemento.className =
                "mensaje-nombre";


            nombreElemento.textContent =
                mensaje.nombre;


            const rangoElemento =
                document.createElement(
                    "span"
                );


            rangoElemento.className =
                "rango-botellero";


            rangoElemento.textContent =
                "[" +
                (
                    mensaje.rango ||
                    "NOOB"
                ) +
                "]";


            nombreElemento.appendChild(
                rangoElemento
            );


            const textoElemento =
                document.createElement(
                    "div"
                );


            textoElemento.className =
                "mensaje-texto";


            textoElemento.textContent =
                mensaje.texto;


            const horaElemento =
                document.createElement(
                    "div"
                );


            horaElemento.className =
                "mensaje-hora";


            horaElemento.textContent =
                mensaje.hora;


            caja.appendChild(
                nombreElemento
            );

            caja.appendChild(
                textoElemento
            );

            caja.appendChild(
                horaElemento
            );


            mensajes.appendChild(
                caja
            );


            mensajes.scrollTop =
                mensajes.scrollHeight;

        }


        /* =========================
           ENVIAR IMAGEN CHAT NORMAL
        ========================= */

        const imagenBtn =
            document.getElementById(
                "imagenBtn"
            );

        const archivoImagen =
            document.getElementById(
                "archivoImagen"
            );


        imagenBtn.addEventListener(
            "click",
            function(){

                archivoImagen.click();

            }
        );


        archivoImagen.addEventListener(
            "change",
            function(){

                const archivo =
                    archivoImagen.files[0];


                if(!archivo){
                    return;
                }


                procesarImagen(
                    archivo,
                    "chat"
                );


                archivoImagen.value =
                    "";

            }
        );


        /* =========================
           ENVIAR IMAGENES
        ========================= */

        const enviarImagenesBtn =
            document.getElementById(
                "enviarImagenesBtn"
            );

        const archivoImagenes =
            document.getElementById(
                "archivoImagenes"
            );


        enviarImagenesBtn.addEventListener(
            "click",
            function(){

                archivoImagenes.click();

            }
        );


        archivoImagenes.addEventListener(
            "change",
            function(){

                const archivo =
                    archivoImagenes.files[0];


                if(!archivo){
                    return;
                }


                procesarImagen(
                    archivo,
                    "imagenes"
                );


                archivoImagenes.value =
                    "";

            }
        );


        /* =========================
           PROCESAR IMAGEN
        ========================= */

        function procesarImagen(
            archivo,
            canal
        ){

            if(
                !archivo.type.startsWith(
                    "image/"
                )
            ){

                alert(
                    "Ese archivo no es una imagen."
                );

                return;

            }


            if(
                archivo.size >
                5 * 1024 * 1024
            ){

                alert(
                    "La imagen es demasiado grande. Máximo 5 MB."
                );

                return;

            }


            const lector =
                new FileReader();


            lector.onload =
                function(){

                    const datos = {

                        nombre:
                            nombre,

                        rango:
                            rangoBotelleroActual,

                        texto:
                            JSON.stringify({

                                tipo:
                                    "imagen",

                                canal:
                                    canal,

                                datos:
                                    lector.result

                            })

                    };


                    socket.emit(
                        "mensaje",
                        datos
                    );

                };


            lector.readAsDataURL(
                archivo
            );

        }


        /* =========================
           IMAGEN EN CHAT
        ========================= */

        function mostrarImagenChat(
            nombreAutor,
            imagen,
            hora,
            rango
        ){

            const mensajes =
                document.getElementById(
                    "mensajes"
                );


            const caja =
                document.createElement(
                    "div"
                );


            caja.className =
                "mensaje";


            if(
                nombreAutor ===
                nombre
            ){

                caja.classList.add(
                    "mio"
                );

            }


            const autor =
                document.createElement(
                    "div"
                );


            autor.className =
                "mensaje-nombre";


            autor.textContent =
                nombreAutor;


            const rangoElemento =
                document.createElement(
                    "span"
                );


            rangoElemento.className =
                "rango-botellero";


            rangoElemento.textContent =
                "[" +
                (
                    rango ||
                    "NOOB"
                ) +
                "]";


            autor.appendChild(
                rangoElemento
            );


            const img =
                document.createElement(
                    "img"
                );


            img.className =
                "imagen-mensaje";


            img.src =
                imagen;


            img.alt =
                "Imagen enviada por " +
                nombreAutor;


            const horaElemento =
                document.createElement(
                    "div"
                );


            horaElemento.className =
                "mensaje-hora";


            horaElemento.textContent =
                hora;


            caja.appendChild(
                autor
            );


            caja.appendChild(
                img
            );


            caja.appendChild(
                horaElemento
            );


            mensajes.appendChild(
                caja
            );


            mensajes.scrollTop =
                mensajes.scrollHeight;

        }


        /* =========================
           IMAGEN EN GALERÍA
        ========================= */

        function mostrarImagenGaleria(
            nombreAutor,
            imagen,
            hora,
            rango
        ){

            const galeria =
                document.getElementById(
                    "galeriaImagenes"
                );


            const tarjeta =
                document.createElement(
                    "div"
                );


            tarjeta.className =
                "imagen-tarjeta";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                imagen;


            img.alt =
                "Imagen de " +
                nombreAutor;


            const autor =
                document.createElement(
                    "div"
                );


            autor.className =
                "imagen-autor";


            autor.textContent =
                "👤 " +
                nombreAutor;


            const rangoElemento =
                document.createElement(
                    "span"
                );


            rangoElemento.className =
                "imagen-rango";


            rangoElemento.textContent =
                "[" +
                (
                    rango ||
                    "NOOB"
                ) +
                "]";


            autor.appendChild(
                rangoElemento
            );


            const horaElemento =
                document.createElement(

                );


            horaElemento.className =

            tarjeta.appendChild(

            );


            tarjeta.appendChild(

            );


            tarjeta.appendChild(

            );


            galeria.appendChild(

            );


            document
                .querySelector(
                    ".imagenes-contenido"
                )
                .scrollTop =
                document
                    .querySelector(
                        ".imagenes-contenido"
                    )
                    .scrollHeight;

        }


        /* =========================
           MOSCA
        ========================= */

        const mosca =
            document.getElementById(
                "mosca"
            );


        const moscaOverlay =
            document.getElementById(
                "moscaOverlay"
            );


        const baleBaleBtn =
            document.getElementById(
                "baleBaleBtn"
            );


        let moscaMoviendose =
            true;


        function moverMosca(){

            if(!moscaMoviendose){
                return;
            }


            const margen =
                10;


            const ancho =
                window.innerWidth -
                mosca.offsetWidth -
                margen * 2;


            const alto =
                window.innerHeight -
                mosca.offsetHeight -
                margen * 2;


            if(
                ancho <= 0 ||
                alto <= 0
            ){

                return;

            }


            const nuevaX =
                margen +
                Math.random() *
                ancho;


            const nuevaY =
                margen +
                Math.random() *
                alto;


            mosca.style.left =
                nuevaX + "px";


            mosca.style.top =
                nuevaY + "px";


            const siguienteMovimiento =
                2800 +
                Math.random() *
                2800;


            setTimeout(
                moverMosca,
                siguienteMovimiento
            );

        }


        mosca.addEventListener(
            "click",
            function(e){

                e.stopPropagation();

                moscaMoviendose =
                    false;

                moscaOverlay.style.display =
                    "flex";

            }
        );


        baleBaleBtn.addEventListener(
            "click",
            function(){

                moscaOverlay.style.display =
                    "none";

                moscaMoviendose =
                    true;

                moverMosca();

            }
        );


        window.addEventListener(
            "resize",
            function(){

                if(
                    moscaMoviendose
                ){

                    moverMosca();

                }

            }
        );


        /* =========================
           RULETA
        ========================= */

        const numerosRuleta = [

            0,32,15,19,4,21,2,25,17,
            34,6,27,13,36,11,30,8,
            23,10,5,24,16,33,1,20,
            14,31,9,22,18,29,7,28,
            12,35,3,26

        ];


        const rojos = new Set([

            1,3,5,7,9,
            12,14,16,18,
            19,21,23,25,27,
            30,32,34,36

        ]);


        const tablaNumeros =
            document.getElementById(
                "tablaNumeros"
            );


        for(
            let numero = 0;
            numero <= 36;
            numero++
        ){

            const boton =
                document.createElement(
                    "button"
                );


            boton.className =
                "numero-apuesta";


            boton.textContent =
                numero;


            if(numero === 0){

                boton.classList.add(
                    "cero"
                );

            } else if(
                rojos.has(numero)
            ){

                boton.classList.add(
                    "rojo"
                );

            } else {

                boton.classList.add(
                    "negro"
                );

            }


            boton.dataset.apuesta =
                "numero-" +
                numero;


            boton.addEventListener(
                "click",
                function(){

                    seleccionarApuesta(
                        "numero-" +
                        numero,
                        boton
                    );

                }
            );


            tablaNumeros.appendChild(
                boton
            );

        }


        /* =========================
           FICHAS
        ========================= */

        document
            .querySelectorAll(
                ".ficha"
            )
            .forEach(
                function(ficha){

                    ficha.addEventListener(
                        "click",
                        function(){

                            document
                                .querySelectorAll(
                                    ".ficha"
                                )
                                .forEach(
                                    function(f){

                                        f.classList.remove(
                                            "seleccionada"
                                        );

                                    }
                                );


                            ficha.classList.add(
                                "seleccionada"
                            );


                            fichaSeleccionada =
                                Number(
                                    ficha.dataset.valor
                                );

                        }
                    );

                }
            );


        /* =========================
           APUESTAS EXTRA
        ========================= */

        document
            .querySelectorAll(
                ".apuesta-extra"
            )
            .forEach(
                function(boton){

                    boton.addEventListener(
                        "click",
                        function(){

                            seleccionarApuesta(
                                boton.dataset.apuesta,
                                boton
                            );

                        }
                    );

                }
            );


        /* =========================
           SELECCIONAR APUESTA
        ========================= */

        function seleccionarApuesta(
            tipo,
            elemento
        ){

            if(girando){
                return;
            }


            if(
                saldo <
                fichaSeleccionada
            ){

                alert(
                    "No tienes suficientes monedas."
                );

                return;

            }


            if(!apuestas[tipo]){

                apuestas[tipo] =
                    0;

            }


            apuestas[tipo] +=
                fichaSeleccionada;


            saldo -=
                fichaSeleccionada;


            comprobarSaldoMinimo();

            actualizarSaldo();

            actualizarResumen();


            elemento.classList.add(
                "apuesta-seleccionada"
            );

        }


        /* =========================
           SALDO MÍNIMO
        ========================= */

        function comprobarSaldoMinimo(){

            if(saldo < 10){

                saldo = 20;

            }

        }


        function actualizarSaldo(){

            document.getElementById(
                "saldo"
            ).textContent =
                saldo;

        }


        function actualizarResumen(){

            let total =
                0;


            Object.values(
                apuestas
            ).forEach(
                function(valor){

                    total +=
                        valor;

                }
            );


            document.getElementById(
                "cantidadApuesta"
            ).textContent =
                total;

        }


        /* =========================
           LIMPIAR APUESTAS
        ========================= */

        document
            .getElementById(
                "botonLimpiar"
            )
            .addEventListener(
                "click",
                limpiarApuestas
            );


        function limpiarApuestas(){

            if(girando){
                return;
            }


            Object.values(
                apuestas
            ).forEach(
                function(valor){

                    saldo +=
                        valor;

                }
            );


            apuestas =
                {};


            document
                .querySelectorAll(
                    ".apuesta-seleccionada"
                )
                .forEach(
                    function(elemento){

                        elemento.classList.remove(
                            "apuesta-seleccionada"
                        );

                    }
                );


            actualizarSaldo();

            actualizarResumen();

        }


        /* =========================
           GIRAR RULETA
        ========================= */

        document
            .getElementById(
                "botonGirar"
            )
            .addEventListener(
                "click",
                girarRuleta
            );


        function calcularTotalApostado(){

            let total =
                0;


            Object.values(
                apuestas
            ).forEach(
                function(valor){

                    total +=
                        valor;

                }
            );


            return total;

        }


        function girarRuleta(){

            if(girando){
                return;
            }


            const total =
                calcularTotalApostado();


            if(total <= 0){

                alert(
                    "Primero tienes que hacer una apuesta."
                );

                return;

            }


            girando =
                true;


            document.getElementById(
                "botonGirar"
            ).disabled =
                true;


            document.getElementById(
                "botonLimpiar"
            ).disabled =
                true;


            const indice =
                Math.floor(
                    Math.random() *
                    numerosRuleta.length
                );


            const numero =
                numerosRuleta[indice];


            const sector =
                360 / 37;


            const rotacionNecesaria =
                360 * 6 -
                indice * sector;


            rotacionActual +=
                rotacionNecesaria;


            document.getElementById(
                "ruedaImagen"
            ).style.transform =
                `rotate(${rotacionActual}deg)`;


            setTimeout(
                function(){

                    terminarGiro(
                        numero
                    );

                },
                5900
            );

        }


        /* =========================
           RESULTADO RULETA
        ========================= */

        function terminarGiro(
            numero
        ){

            let ganancia =
                0;


            if(
                apuestas[
                    "numero-" +
                    numero
                ]
            ){

                ganancia +=
                    apuestas[
                        "numero-" +
                        numero
                    ] * 36;

            }


            if(numero !== 0){

                if(
                    rojos.has(numero) &&
                    apuestas.rojo
                ){

                    ganancia +=
                        apuestas.rojo *
                        2;

                }


                if(
                    !rojos.has(numero) &&
                    apuestas.negro
                ){

                    ganancia +=
                        apuestas.negro *
                        2;

                }


                if(
                    numero % 2 === 0 &&
                    apuestas.par
                ){

                    ganancia +=
                        apuestas.par *
                        2;

                }


                if(
                    numero % 2 !== 0 &&
                    apuestas.impar
                ){

                    ganancia +=
                        apuestas.impar *
                        2;

                }


                if(
                    numero >= 1 &&
                    numero <= 18 &&
                    apuestas.bajo
                ){

                    ganancia +=
                        apuestas.bajo *
                        2;

                }


                if(
                    numero >= 19 &&
                    numero <= 36 &&
                    apuestas.alto
                ){

                    ganancia +=
                        apuestas.alto *
                        2;

                }


                if(
                    numero >= 1 &&
                    numero <= 12 &&
                    apuestas.docena1
                ){

                    ganancia +=
                        apuestas.docena1 *
                        3;

                }


                if(
                    numero >= 13 &&
                    numero <= 24 &&
                    apuestas.docena2
                ){

                    ganancia +=
                        apuestas.docena2 *
                        3;

                }


                if(
                    numero >= 25 &&
                    numero <= 36 &&
                    apuestas.docena3
                ){

                    ganancia +=
                        apuestas.docena3 *
                        3;

                }

            }


            saldo +=
                ganancia;


            comprobarSaldoMinimo();

            actualizarSaldo();


            const resultado =
                document.getElementById(
                    "resultadoRuleta"
                );


            if(ganancia > 0){

                resultado.textContent =
                    `🎉 Ha salido ${numero} · +${ganancia} 🪙`;

            } else {

                resultado.textContent =
                    `Ha salido ${numero} · Sin premio`;

            }


            apuestas =
                {};


            document
                .querySelectorAll(
                    ".apuesta-seleccionada"
                )
                .forEach(
                    function(elemento){

                        elemento.classList.remove(
                            "apuesta-seleccionada"
                        );

                    }
                );


            actualizarResumen();


            girando =
                false;


            document.getElementById(
                "botonGirar"
            ).disabled =
                false;


            document.getElementById(
                "botonLimpiar"
            ).disabled =
                false;

        }


        /* =========================
           INICIO
        ========================= */

        actualizarSaldo();

        actualizarResumen();

    </script>

</body>
</html>
